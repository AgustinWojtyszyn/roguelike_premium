name: Complete VIDA asset bank

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/complete-vida-asset-bank.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout premium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned VIDA source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/AgustinWojtyszyn/Life--simulador-de-vida.git /tmp/vida
          git -C /tmp/vida checkout --detach 5d5192da4b258d36a330ef84f5617269ab9d0530

      - name: Copy all useful VIDA assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf asset_bank/raw/vida
          mkdir -p asset_bank/raw/vida
          cd /tmp/vida
          count=0
          while IFS= read -r -d '' file; do
            rel="${file#assets/}"
            mkdir -p "$GITHUB_WORKSPACE/asset_bank/raw/vida/$(dirname "$rel")"
            cp "$file" "$GITHUB_WORKSPACE/asset_bank/raw/vida/$rel"
            count=$((count + 1))
          done < <(find assets -type f \
            ! -name '*.import' \
            ! -name '*.uid' \
            ! -name '*.md' \
            ! -name '.gitkeep' \
            ! -path 'assets/architecture_plan.json' \
            -print0)
          echo "Copied $count VIDA files"
          test "$count" -eq 557

      - name: Commit raw VIDA bank
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset_bank/raw/vida
          git diff --cached --quiet && exit 0
          git commit -m "Complete VIDA asset bank with all 557 useful files"
          git push origin HEAD:main
