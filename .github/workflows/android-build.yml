name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, chore/premium-asset-rebuild-20261007]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_SDK="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_TAG="4.7.2-stable"
          GODOT_BASE="Godot_v4.7.2-stable"

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_BASE}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/${GODOT_BASE}_linux.x86_64"
          sudo mv "/tmp/godot/${GODOT_BASE}_linux.x86_64" /usr/local/bin/godot

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_BASE}_export_templates.tpz" -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates

          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

          godot --version
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"

      - name: Create debug keystore
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Validate project
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m unittest discover -s tests -v
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          timeout 60s godot --headless --path . -- --fresh --quit=4 2>&1 | tee /tmp/godot-smoke.log
          timeout 90s godot --headless --path . scenes/run.tscn -- --bot --god --quit=10 --fresh 2>&1 | tee -a /tmp/godot-smoke.log
          timeout 240s godot --headless --path . --script tests/run_tests.gd 2>&1 | tee /tmp/godot-tests.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:|FAIL " /tmp/godot-import.log /tmp/godot-smoke.log /tmp/godot-tests.log

      - name: Export debug APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/roguelike_premium.apk
          test -s build/roguelike_premium.apk
          ls -lh build/roguelike_premium.apk
          sha256sum build/roguelike_premium.apk | tee build/roguelike_premium.apk.sha256

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android emulator smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: python3 tools/android_cold_start.py --apk build/roguelike_premium.apk --runs 5 --seconds 20 --out build/android-cold-start

      - name: Upload complete startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-cold-start-evidence
          path: build/android-cold-start/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roguelike-premium-android
          path: |
            build/roguelike_premium.apk
            build/roguelike_premium.apk.sha256
          if-no-files-found: error
          retention-days: 7
