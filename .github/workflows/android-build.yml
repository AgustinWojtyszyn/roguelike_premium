name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_SDK="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_TAG="4.7.2-stable"
          GODOT_BASE="Godot_v4.7.2-stable"

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_BASE}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/${GODOT_BASE}_linux.x86_64"
          sudo mv "/tmp/godot/${GODOT_BASE}_linux.x86_64" /usr/local/bin/godot

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_BASE}_export_templates.tpz" -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates

          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

          godot --version
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"

      - name: Create debug keystore
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Validate project
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . --import
          timeout 20s godot --headless --path . -- --bot --god --quit=8 || test $? -eq 124

      - name: Export debug APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/roguelike_premium.apk
          test -s build/roguelike_premium.apk
          ls -lh build/roguelike_premium.apk
          sha256sum build/roguelike_premium.apk | tee build/roguelike_premium.apk.sha256

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android emulator smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            set -eux
            adb install -r build/roguelike_premium.apk
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell settings put system user_rotation 0 || true
            adb logcat -c
            adb shell am force-stop com.agustin.roguelikepremium
            adb shell monkey -p com.agustin.roguelikepremium -c android.intent.category.LAUNCHER 1
            sleep 2
            adb shell pidof com.agustin.roguelikepremium | tr -d '\r' > /tmp/roguelike_pid1
            test -s /tmp/roguelike_pid1
            sleep 8
            adb shell pidof com.agustin.roguelikepremium | tr -d '\r' > /tmp/roguelike_pid2
            test -s /tmp/roguelike_pid2
            cmp /tmp/roguelike_pid1 /tmp/roguelike_pid2
            echo "Cold start stayed alive with stable PID $(cat /tmp/roguelike_pid2)"
            adb shell dumpsys activity activities | grep -E "mResumedActivity|com.agustin.roguelikepremium" | head -20 || true
            adb logcat -d -v brief | grep -E "godot|FATAL EXCEPTION|AndroidRuntime" | tail -250 || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roguelike-premium-android
          path: |
            build/roguelike_premium.apk
            build/roguelike_premium.apk.sha256
          if-no-files-found: error
          retention-days: 7
