name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          java -version

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_TAG="4.7.2-stable"
          GODOT_BASE="Godot_v4.7.2-stable"

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_BASE}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/${GODOT_BASE}_linux.x86_64"
          sudo mv "/tmp/godot/${GODOT_BASE}_linux.x86_64" /usr/local/bin/godot

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_BASE}_export_templates.tpz" -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates

          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

          godot --version
          ls -la "$HOME/.local/share/godot/export_templates/4.7.2.stable" | head

      - name: Configure Android export
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p .ci
          cat > .ci/configure_android.gd <<'GDSCRIPT'
          extends SceneTree

          func _init() -> void:
              var sdk := OS.get_environment("ANDROID_HOME")
              var java_home := OS.get_environment("JAVA_HOME")
              var home := OS.get_environment("HOME")
              EditorSettings.set_setting("export/android/android_sdk_path", sdk)
              EditorSettings.set_setting("export/android/java_sdk_path", java_home)
              EditorSettings.set_setting("export/android/debug_keystore", home.path_join(".android/debug.keystore"))
              EditorSettings.set_setting("export/android/debug_keystore_user", "androiddebugkey")
              EditorSettings.set_setting("export/android/debug_keystore_pass", "android")
              EditorSettings.save()
              quit()
          GDSCRIPT

          godot --headless --editor --path . --script res://.ci/configure_android.gd
          rm -f .ci/configure_android.gd

      - name: Validate project
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . --import
          timeout 20s godot --headless --path . -- --bot --god --quit=8 || test $? -eq 124

      - name: Export debug APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/roguelike_premium.apk
          test -s build/roguelike_premium.apk
          ls -lh build/roguelike_premium.apk
          sha256sum build/roguelike_premium.apk | tee build/roguelike_premium.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roguelike-premium-android
          path: |
            build/roguelike_premium.apk
            build/roguelike_premium.apk.sha256
          if-no-files-found: error
          retention-days: 7
